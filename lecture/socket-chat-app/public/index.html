<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Websocket Chat</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
        color: #e0e0e0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .chat-container {
        width: 100%;
        max-width: 500px;
        height: 90vh;
        max-height: 700px;
        background: linear-gradient(180deg, #16213e 0%, #0f3460 100%);
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.8),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .chat-header {
        background: linear-gradient(90deg, #16213e 0%, #0f3460 100%);
        padding: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header-title {
        flex: 1;
      }

      .header-title h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .header-title p {
        font-size: 12px;
        color: #a0a0a0;
      }

      .online-indicator {
        width: 12px;
        height: 12px;
        background: #2ecc71;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .chat-messages::-webkit-scrollbar {
        width: 6px;
      }

      .chat-messages::-webkit-scrollbar-track {
        background: transparent;
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      .chat-messages::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .message {
        display: flex;
        margin-bottom: 8px;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.sent {
        justify-content: flex-end;
      }

      .message.received {
        justify-content: flex-start;
      }

      .message-bubble {
        padding: 12px 16px;
        border-radius: 18px;
        word-wrap: break-word;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }

      .message.sent .message-bubble {
        background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
        color: #ffffff;
        border-bottom-right-radius: 4px;
      }

      .message.received .message-bubble {
        background: rgba(255, 255, 255, 0.1);
        color: #e0e0e0;
        border-bottom-left-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      .message-time {
        font-size: 10px;
        color: #707080;
        margin-top: 4px;
        padding: 0 8px;
      }

      .chat-input-form {
        background: rgba(0, 0, 0, 0.3);
        padding: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .input-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 10px 16px;
        transition: all 0.3s ease;
      }

      .input-wrapper:focus-within {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(0, 102, 255, 0.5);
        box-shadow: 0 0 12px rgba(0, 102, 255, 0.2);
      }

      #messageInput {
        flex: 1;
        background: transparent;
        border: none;
        color: white;
        outline: none;
        font-size: 14px;
        font-family: inherit;
      }

      #messageInput::placeholder {
        color: #707080;
      }

      .send-button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 4px 12px rgba(0, 102, 255, 0.3);
      }

      .send-button:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 16px rgba(0, 102, 255, 0.4);
      }

      .send-button:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <div class="header-title">
          <h1>Chat Room</h1>
          <p>Online</p>
        </div>
        <div class="online-indicator"></div>
      </div>

      <div class="chat-messages">
        <div class="message received">
          <div>
            <div class="message-bubble">Hey! How are you doing?</div>
            <div class="message-time">10:30 AM</div>
          </div>
        </div>

        <div class="message sent">
          <div style="text-align: right">
            <div class="message-bubble">
              I'm doing great, thanks for asking!
            </div>
            <div class="message-time">10:31 AM</div>
          </div>
        </div>

        <div class="message received">
          <div>
            <div class="message-bubble">
              That's awesome! What have you been up to?
            </div>
            <div class="message-time">10:32 AM</div>
          </div>
        </div>

        <div class="message sent">
          <div style="text-align: right">
            <div class="message-bubble">
              Just working on some projects. Pretty exciting stuff! 🚀
            </div>
            <div class="message-time">10:33 AM</div>
          </div>
        </div>

        <div class="message received">
          <div>
            <div class="message-bubble">
              That sounds fun! Tell me more about it.
            </div>
            <div class="message-time">10:34 AM</div>
          </div>
        </div>
      </div>

      <form class="chat-input-form" id="messageForm">
        <div class="input-wrapper">
          <input
            type="text"
            id="messageInput"
            placeholder="Type a message..."
          />
        </div>
        <button type="submit" class="send-button">➤</button>
      </form>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      socket.on('server:message', (data) => {
        console.log('message from server', data);
        if (data) appendMessage(data);
      });
      const messageForm = document.getElementById('messageForm');
      const messageInput = document.getElementById('messageInput');
      const chatMessages = document.querySelector('.chat-messages');

      function appendMessage(messageText) {
        // Create the message element
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message sent';

        const innerDiv = document.createElement('div');
        innerDiv.style.textAlign = 'right';

        const messageBubble = document.createElement('div');
        messageBubble.className = 'message-bubble';
        messageBubble.textContent = messageText;

        const messageTime = document.createElement('div');
        messageTime.className = 'message-time';
        const now = new Date();
        messageTime.textContent = now.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
        });

        innerDiv.appendChild(messageBubble);
        innerDiv.appendChild(messageTime);
        messageDiv.appendChild(innerDiv);

        // Append to chat messages
        chatMessages.appendChild(messageDiv);

        // Auto-scroll to bottom
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function onMessageHandler(text) {
        console.log(text);
        socket.emit('user:message', text);
      }

      messageForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const messageText = messageInput.value.trim();
        if (messageText === '') return;

        appendMessage(messageText);
        onMessageHandler(messageText);

        // Clear input
        messageInput.value = '';
        messageInput.focus();
      });

      messageInput.focus();
    </script>
  </body>
</html>
