<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic List Creator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="container">
    <h1 id="title">Dynamic List Generator</h1>
    <div class="input-container">
      <input type="text" placeholder="Enter task..." name="task-input" id="task-input">
      <button class="add-task-btn" id="add-task-btn">Add Task</button>
    </div>
    <ul class="lists"></ul>
  </main>
  <script src="main.js"></script>
</body>

</html>
